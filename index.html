<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <title>Tubular Tutor</title>
</head>
<body>
    <h1>Tubular Tutor</h1>
    <main id="call">
        <p>What seek you, young padawan?</p>
        <label for="prompt">Your question</label>
        <textarea id="prompt" placeholder="Ask your question (supports LaTeX: \sqrt{2x-5}=7)" rows="4"></textarea>
        <label for="imageUpload">Upload a diagram or assignment (optional)</label>
        <input id="imageUpload" type="file" accept="image/jpeg,image/png,image/webp">
        <div id="imagePreview" aria-live="polite"></div>
        <button id="clearImage" type="button" hidden>Remove image</button>
        <label for="grade">What is your grade level?</label>
        <select id="grade">
            <option value="1">1</option><option value="2">2</option><option value="3">3</option>
            <option value="4">4</option><option value="5">5</option><option value="6">6</option>
            <option value="7">7</option><option value="8">8</option><option value="9">9</option>
            <option value="10">10</option><option value="11">11</option><option value="12">12</option>
        </select>
    </main>
    <button id="sendPrompt" type="button">Seek wisdom</button>
    <div id="loading" style="display: none; text-align: center;">
        <img src="loading.gif" class="spinner" alt="Loading">
        <div id="statusLog" aria-live="polite" style="margin-top: 10px; font-size: 0.9em; color: #666; max-width: 400px; margin-left: auto; margin-right: auto;"></div>
    </div>
    <section id="response" style="display: none;" aria-live="polite"></section>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
